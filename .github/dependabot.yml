version: 2

# Weekly, one grouped pull request per ecosystem and folder: updates arrive in
# a size one person can review. Security updates open as soon as they are
# published, whatever the schedule says.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  # ── Python services ──────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: "/hub/backend"
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
    ignore:
      # 0.0.45+ rejects naive datetimes; the backend writes datetime.utcnow() everywhere.
      - dependency-name: "sqlmodel"
        versions: [">=0.0.45"]
      # passlib 1.7.4 probes bcrypt with a 255-byte secret, which bcrypt 5 refuses.
      - dependency-name: "bcrypt"
        versions: [">=4.1"]
  - package-ecosystem: pip
    directory: "/hub/workspaced"
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: "/mcp_gateway/backend"
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: "/mcp_host/backend"
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }

  # ── Node projects ────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/hub/frontend"
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }
    ignore:
      # Majors are migrations, not bumps (React 19, Router 7, Tailwind 4, Vite 8,
      # ESLint 9+ flat config): each is its own change, made by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── Base images ──────────────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: "/hub/backend"
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: "/hub/frontend"
    schedule: { interval: weekly }
    ignore:
      # Node stays on an LTS line; moving to the next one is a deliberate change.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: "/hub/workspaced"
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: "/hub/workspaced/workspace-image"
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: "/mcp_host/backend"
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: "/mcp_gateway/backend"
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: "/mcp_runner"
    schedule: { interval: weekly }
    ignore:
      # Node stays on an LTS line; moving to the next one is a deliberate change.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  # The install stack is a Compose file, not a Dockerfile. Its own images are
  # pinned to the release tag, so only the third-party ones are watched.
  - package-ecosystem: docker-compose
    directory: "/deploy/selfhost"
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "ghcr.io/mylegiononline/*"
      # A new PostgreSQL major starts an empty cluster next to the old one;
      # installs need a pg_upgrade step and release notes, not a bump.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
