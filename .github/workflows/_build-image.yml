name: Build one image (amd64 + arm64)

# Called by release.yml, once per image. Each architecture is built on a runner
# of its own architecture (no QEMU emulation: the workspace images are heavy),
# pushed by digest, then joined into one multi-arch tag.
on:
  workflow_call:
    inputs:
      name:
        description: "Image name under ghcr.io/<owner>/, e.g. hub-backend"
        required: true
        type: string
      context:
        description: "Build context directory"
        required: true
        type: string
      tags:
        description: "Newline-separated tag suffixes to publish, e.g. v0.1.0 and latest"
        required: true
        type: string
      build-args:
        description: "Newline-separated KEY=VALUE build arguments"
        required: false
        type: string
        default: ""
      build-contexts:
        description: "Newline-separated NAME=VALUE named build contexts"
        required: false
        type: string
        default: ""
      push:
        description: "false = build only (checks that both architectures build)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.name }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The registry path must be lower case; the organization is MyLegionOnline.
      - name: Image path
        id: path
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.name }}" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ inputs.build-args }}
          build-contexts: ${{ inputs.build-contexts }}
          # Push by digest only; the tag is attached once, in `merge`.
          outputs: ${{ inputs.push && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.path.outputs.image) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ inputs.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.name }}-${{ matrix.arch }}
          provenance: false

      - name: Export digest
        if: inputs.push
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ inputs.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ inputs.name }} manifest
    if: inputs.push
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.name }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the two architectures under the tags
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.name }}"
          tag_args=""
          for tag in $TAGS; do tag_args="$tag_args -t ${image}:${tag}"; done
          docker buildx imagetools create $tag_args $(printf "${image}@sha256:%s " *)

      - name: Show the result
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.name }}"
          for tag in $TAGS; do docker buildx imagetools inspect "${image}:${tag}"; done
