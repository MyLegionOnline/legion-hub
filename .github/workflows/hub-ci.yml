name: Hub CI

# Tests of the open Hub on every pull request and push to main.
#
# Pull requests from forks run with a read-only token and no secrets, because
# the trigger is `pull_request` (never `pull_request_target`, which would run
# fork code with this repository's secrets).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub-backend:
    name: Hub backend (tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: hub/backend
    env:
      # The database tests refuse to run on a database whose name has no "test" in it.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/legion_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: hub/backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt pytest-timeout
      # A test that hangs must fail the run, not hold it until the job limit.
      - run: python -m pytest -p no:randomly --timeout=300 -q

  python-services:
    name: ${{ matrix.service }} (tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [hub/workspaced, mcp_gateway/backend, mcp_host/backend]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio httpx
      - run: python -m pytest -q

  hub-frontend:
    name: Hub frontend (lint, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hub/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # The install stack must stay valid with nothing but .env.example filled in
  # and, with the caddy profile, with a domain.
  selfhost-compose:
    name: Self-host compose (config)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: deploy/selfhost
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose --profile caddy config --quiet
      - name: install.sh is valid POSIX sh
        run: sh -n install.sh
