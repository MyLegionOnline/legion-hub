name: No plans

# Planning documents never belong in the public tree. Runs only in the public
# repository: the private one keeps its plans and would always fail.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  no-plans:
    if: github.repository == 'MyLegionOnline/legion-hub'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh .github/scripts/check_no_plans.sh
