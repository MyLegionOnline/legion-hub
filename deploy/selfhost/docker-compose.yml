name: legion

# Legion Hub for one operator: the stack `install.sh` / `install.ps1` starts.
#
#   docker compose up -d                       # the Hub
#   docker compose --profile caddy up -d       # + HTTPS on your own domain
#
# What is in it: PostgreSQL, Redis, the Hub (backend + frontend), the room
# daemon (workspaced), the personal-MCP supervisor (mcp-host) and the MCP
# gateway (the SSRF-guarded door to MCP servers you add by link). What is not:
# Legion Market, Admin Center, monitoring, web search. By default the Hub
# sends nothing to Legion (docs/SELF_HOSTING_PRIVACY.md).
#
# Everything you may want to change is in .env (see .env.example) and
# config/legion.toml (see docs/CONFIGURATION.md). Do not edit this file.
#
# Images are pulled from GitHub Container Registry. To build them from a
# checkout instead: `docker compose build` (the build contexts are the
# directories of this repository).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: legion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run install.sh, or copy .env.example to .env and fill it in}
      POSTGRES_DB: legion
    volumes:
      # From 18 the image keeps its data in /var/lib/postgresql/<major>/docker, so
      # the volume holds the parent folder; a later major can sit beside it for
      # pg_upgrade. Mounting /var/lib/postgresql/data makes the image refuse to start.
      - postgres_data:/var/lib/postgresql
    networks:
      - hub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legion -d legion"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  # The plan-dialogue journal and the MCP gateway's cache; --appendonly keeps
  # them across restarts.
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - hub
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  # Writes the key that encrypts the secrets the Hub stores (provider keys,
  # room secrets) into its own volume, once. Losing that volume loses those
  # secrets: back it up (docs/INSTALL.md, "Backups").
  keyring-init:
    image: ghcr.io/mylegiononline/hub-backend:${LEGION_VERSION:-latest}
    build: ../../hub/backend
    entrypoint: ["python", "-c"]
    command:
      - |
        import base64, datetime, json, os, secrets, sys
        path = "/secrets/legion_secret_keyring"
        if os.path.exists(path):
            sys.exit(0)
        key_id = datetime.date.today().isoformat()
        document = {"active_key_id": key_id, "keys": {key_id: base64.b64encode(secrets.token_bytes(32)).decode()}}
        fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
        with os.fdopen(fd, "w") as handle:
            json.dump(document, handle, indent=2)
        print("created " + path)
    volumes:
      - legion_secrets:/secrets
    restart: "no"
    logging: *default-logging

  backend:
    image: ghcr.io/mylegiononline/hub-backend:${LEGION_VERSION:-latest}
    build: ../../hub/backend
    environment:
      DATABASE_URL: postgresql+asyncpg://legion:${POSTGRES_PASSWORD}@db:5432/legion
      SECRET_KEY: ${SECRET_KEY:?run install.sh, or copy .env.example to .env and fill it in}
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:-http://localhost:8080}
      REDIS_URL: redis://redis:6379/0
      # Hub-wide settings (limits, registration, [[personal_mcp]]): config/legion.toml,
      # mounted at /etc/legion. The Hub starts without the file too (all defaults).
      LEGION_REGISTRATION: ${LEGION_REGISTRATION:-}
      # Server-wide [capacity]; empty = the file decides (no cap by default).
      LEGION_CAPACITY_MAX_WORKSPACES: ${LEGION_CAPACITY_MAX_WORKSPACES:-}
      LEGION_CAPACITY_MEMORY_MB: ${LEGION_CAPACITY_MEMORY_MB:-}
      LEGION_LIMIT_MAX_RUNNING: ${LEGION_LIMIT_MAX_RUNNING:-}
      LEGION_LIMIT_MAX_ROOMS: ${LEGION_LIMIT_MAX_ROOMS:-}
      LEGION_LIMIT_MONTHLY_HOURS: ${LEGION_LIMIT_MONTHLY_HOURS:-}
      LEGION_LIMIT_MEM_LIMIT_MB: ${LEGION_LIMIT_MEM_LIMIT_MB:-}
      LEGION_LIMIT_MARKET_PAID_TIERS: ${LEGION_LIMIT_MARKET_PAID_TIERS:-}
      LEGION_LIMIT_MCP_PERSONAL_MAX_RUNNING: ${LEGION_LIMIT_MCP_PERSONAL_MAX_RUNNING:-}
      LEGION_LIMIT_MCP_PERSONAL_MAX_ROOMS: ${LEGION_LIMIT_MCP_PERSONAL_MAX_ROOMS:-}
      LEGION_LIMIT_MCP_PERSONAL_MONTHLY_HOURS: ${LEGION_LIMIT_MCP_PERSONAL_MONTHLY_HOURS:-}
      LEGION_LIMIT_MCP_PERSONAL_MEM_LIMIT_MB: ${LEGION_LIMIT_MCP_PERSONAL_MEM_LIMIT_MB:-}
      LEGION_LIMIT_MCP_PERSONAL_MAX_INSTALLED: ${LEGION_LIMIT_MCP_PERSONAL_MAX_INSTALLED:-}
      LEGION_LIMIT_MCP_PERSONAL_MAX_TOTAL_MEMORY_MB: ${LEGION_LIMIT_MCP_PERSONAL_MAX_TOTAL_MEMORY_MB:-}
      LEGION_LIMIT_MCP_PERSONAL_MAX_MEMORY_PER_SERVER_MB: ${LEGION_LIMIT_MCP_PERSONAL_MAX_MEMORY_PER_SERVER_MB:-}
      LEGION_LIMIT_MCP_PERSONAL_STORAGE_QUOTA_MB: ${LEGION_LIMIT_MCP_PERSONAL_STORAGE_QUOTA_MB:-}
      LEGION_LIMIT_MCP_PERSONAL_MAX_STORAGE_PER_SERVER_MB: ${LEGION_LIMIT_MCP_PERSONAL_MAX_STORAGE_PER_SERVER_MB:-}
      LEGION_LIMIT_MCP_PERSONAL_MAX_ROOM_BINDINGS_PER_SERVER: ${LEGION_LIMIT_MCP_PERSONAL_MAX_ROOM_BINDINGS_PER_SERVER:-}
      LEGION_LIMIT_MCP_WEEKLY_CREDITS: ${LEGION_LIMIT_MCP_WEEKLY_CREDITS:-}
      LEGION_LIMIT_ROOMS_MEMORY_POOL_MB: ${LEGION_LIMIT_ROOMS_MEMORY_POOL_MB:-}
      LEGION_LIMIT_ROOM_MAX_MEMORY_MB: ${LEGION_LIMIT_ROOM_MAX_MEMORY_MB:-}
      LEGION_LIMIT_ROOM_STORAGE_QUOTA_MB: ${LEGION_LIMIT_ROOM_STORAGE_QUOTA_MB:-}
      LEGION_LIMIT_CONTAINER_LAYER_MB: ${LEGION_LIMIT_CONTAINER_LAYER_MB:-}
      LEGION_LIMIT_HUB_DATA_SOFT_QUOTA_MB: ${LEGION_LIMIT_HUB_DATA_SOFT_QUOTA_MB:-}
      LEGION_LIMIT_LINK_MCP_MAX: ${LEGION_LIMIT_LINK_MCP_MAX:-}
      LEGION_LIMIT_SKILL_PACKAGE_MAX_MB: ${LEGION_LIMIT_SKILL_PACKAGE_MAX_MB:-}
      LEGION_LIMIT_SKILLS_STORAGE_MB: ${LEGION_LIMIT_SKILLS_STORAGE_MB:-}
      LEGION_OWNER_EMAIL: ${LEGION_OWNER_EMAIL:-}
      LEGION_SOURCE_URL: ${LEGION_SOURCE_URL:-}
      # The encryption key for stored secrets, created by keyring-init.
      SECRETS_KEYRING_REQUIRED: "true"
      SECRET_KEYRING_PATH: /secrets/legion_secret_keyring
      SECRETS_STORE_MODE: strict
      SECRETS_ALLOW_LEGACY_WRITE: "false"
      # No Legion Market by default: nothing leaves this machine except calls
      # to the LLM providers and git hosts you configure.
      MARKET_ENABLED: ${MARKET_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Built-in web_search tool for agents (docs/SEARCH.md). Off while the key is empty.
      WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-brave}
      # Room containers: the daemon below creates them, from these images.
      WORKSPACED_URL: http://workspaced:8100
      WORKSPACED_TOKEN: ${WORKSPACED_TOKEN:?run install.sh, or copy .env.example to .env and fill it in}
      WORKSPACE_IMAGE_BASE: ghcr.io/mylegiononline/legion-workspace:base-${LEGION_VERSION:-latest}
      WORKSPACE_IMAGE_OFFICE: ghcr.io/mylegiononline/legion-workspace:office-${LEGION_VERSION:-latest}
      # Personal MCP servers (npm packages run in their own containers).
      MCP_HOST_URL: http://mcp-host:8320
      MCP_HOST_TOKEN: ${MCP_HOST_TOKEN:?run install.sh, or copy .env.example to .env and fill it in}
      PERSONAL_MCP_MANAGED_STDIO_ENABLED: "1"
      PERSONAL_MCP_ROLLOUT_STAGE: limited
      # MCP servers added by link go through the gateway.
      MCP_GATEWAY_URL: http://mcp-gateway:8310
      MCP_GATEWAY_TOKEN: ${MCP_GATEWAY_TOKEN:?run install.sh, or copy .env.example to .env and fill it in}
      HTTP_MCP_VERIFIED_DISCOVERY_V1: "on"
    volumes:
      - legion_secrets:/secrets:ro
      - ./config:/etc/legion:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keyring-init:
        condition: service_completed_successfully
    networks:
      - hub
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics/', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging

  # Creates and removes the room containers through the Docker socket of the
  # machine this stack runs on. Anyone who controls this container controls
  # Docker: it is reachable only from the Hub network and needs the token.
  workspaced:
    image: ghcr.io/mylegiononline/hub-workspaced:${LEGION_VERSION:-latest}
    build: ../../hub/workspaced
    environment:
      WORKSPACED_TOKEN: ${WORKSPACED_TOKEN}
      WORKSPACE_IMAGE: ghcr.io/mylegiononline/legion-workspace:base-${LEGION_VERSION:-latest}
      WORKSPACE_DATA_DIR: /var/lib/workspaced/data
      WORKSPACE_TMP_MB: ${WORKSPACE_TMP_MB:-512}
      # The real Docker name of the volume below: room containers mount it
      # with Subpath=<room id> (Docker Engine 26 or newer).
      WORKSPACE_VOLUME_NAME: legion_workspace_data
      ROOM_ARCHIVE_DIR: /var/lib/workspaced/archive
      IDLE_REAPER_ENABLED: "false"
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - workspace_data:/var/lib/workspaced/data
      - room_archive:/var/lib/workspaced/archive
    networks:
      - hub
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

  # Pull the images of the room containers and of personal MCP servers with
  # the rest of the stack, so the first room starts at once. They only exit.
  workspace-base:
    image: ghcr.io/mylegiononline/legion-workspace:base-${LEGION_VERSION:-latest}
    build: ../../hub/workspaced/workspace-image
    command: ["true"]
    restart: "no"
    network_mode: none
    logging: *default-logging

  workspace-office:
    image: ghcr.io/mylegiononline/legion-workspace:office-${LEGION_VERSION:-latest}
    build:
      context: ../../hub/workspaced/workspace-image-office
      # The Dockerfile starts FROM legion-workspace:base: build that one first.
      additional_contexts:
        legion-workspace:base: service:workspace-base
    command: ["true"]
    restart: "no"
    network_mode: none
    depends_on:
      workspace-base:
        condition: service_completed_successfully
    logging: *default-logging

  mcp-node-runner:
    image: ghcr.io/mylegiononline/mcp-node-runner:${LEGION_VERSION:-latest}
    build: ../../mcp_runner
    entrypoint: ["true"]
    restart: "no"
    network_mode: none
    logging: *default-logging

  frontend:
    image: ghcr.io/mylegiononline/hub-frontend:${LEGION_VERSION:-latest}
    build:
      context: ../../hub/frontend
      args:
        # Where the Marketplace button leads (only shown with MARKET_ENABLED=true).
        VITE_MARKET_URL: https://market.mylegion.online
    environment:
      # /internal/admin/* belongs to the closed cloud plugin; nothing here uses it.
      ADMIN_ALLOW_IP: 127.0.0.1
    ports:
      - "${LEGION_BIND:-127.0.0.1}:${LEGION_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - hub
    restart: unless-stopped
    logging: *default-logging

  # Supervises personal MCP servers: one container per server, on mcp-net.
  mcp-host:
    image: ghcr.io/mylegiononline/mcp-host:${LEGION_VERSION:-latest}
    build: ../../mcp_host/backend
    environment:
      MCP_HOST_TOKEN: ${MCP_HOST_TOKEN}
      # Runner containers are created through the Docker API, which wants the
      # real network names (see `networks:` below), not Compose service names.
      MCP_HOST_NETWORK: legion_hub_net
      MCP_HOST_RUNNER_NETWORK: legion_mcp_net
      MCP_HOST_RUNNER_IMAGE: ghcr.io/mylegiononline/mcp-node-runner:${LEGION_VERSION:-latest}
      MCP_HOST_HUB_URL: http://backend:8000
      MCP_HOST_STORAGE_QUOTA_MODE: best_effort
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    expose:
      - "8320"
    depends_on:
      backend:
        condition: service_started
      mcp-node-runner:
        condition: service_completed_successfully
    networks:
      - hub
      - mcp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8320/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  # The door to MCP servers you add by link. HTTPS only, and private or
  # metadata addresses are refused after DNS resolution, so a link cannot
  # reach this machine's network. Not used for anything from Legion Market.
  mcp-gateway:
    image: ghcr.io/mylegiononline/mcp-gateway:${LEGION_VERSION:-latest}
    build: ../../mcp_gateway/backend
    environment:
      MCP_GATEWAY_TOKEN: ${MCP_GATEWAY_TOKEN}
      REDIS_URL: redis://redis:6379/0
      MCP_GATEWAY_ACCOUNT_KEYS: "0"
      MCP_CREDITS_VERIFY: "0"
      MCP_EGRESS_MODE: "off"
      MCP_GATEWAY_REQUIRE_HTTPS: ${MCP_GATEWAY_REQUIRE_HTTPS:-true}
      MCP_GATEWAY_DNS_REBIND_PROTECTION: "true"
    mem_limit: ${MCP_GATEWAY_MEM_LIMIT:-512m}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - hub
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8310/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # HTTPS on your own domain (profile "caddy"): a certificate from Let's
  # Encrypt, renewed by itself. Needs HUB_DOMAIN in .env, ports 80 and 443
  # open, and the domain's DNS pointing at this machine.
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
    networks:
      - hub
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  legion_secrets:
  caddy_data:
  caddy_config:
  workspace_data:
    # Fixed: workspaced mounts it into room containers by this exact name.
    name: legion_workspace_data
  room_archive:

networks:
  hub:
    name: legion_hub_net
    driver: bridge
  # Personal MCP runners and mcp-host only; the Hub is not on it.
  mcp:
    name: legion_mcp_net
    driver: bridge
