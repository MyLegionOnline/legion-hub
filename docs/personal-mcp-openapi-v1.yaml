openapi: 3.1.0
info:
  title: Legion Personal MCP API
  version: 1.0.0
  description: >
    Stage-0 contract for managed stdio personal MCP servers. Contract identifier
    personal-mcp.v1. The API never returns secret values or the internal Gateway
    endpoint. The managed runtime accepts only node_npx_v1 command forms.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: personal-mcps
  - name: room-bindings
  - name: secret-bindings
paths:
  /api/v1/personal-mcps/import-preview:
    post:
      tags: [personal-mcps]
      operationId: previewPersonalMcpImport
      summary: Parse and normalize an MCP config without starting anything
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportPreviewRequest'
            examples:
              depwire:
                $ref: '#/components/examples/DepwireImport'
      responses:
        '200':
          description: Preview candidates and safe rejections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPreviewResponse'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '422':
          $ref: '#/components/responses/InvalidPayload'
  /api/v1/personal-mcps:
    get:
      tags: [personal-mcps]
      operationId: listPersonalMcps
      summary: List the authenticated user's personal MCPs
      responses:
        '200':
          description: Personal MCP list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonalMcp'
    post:
      tags: [personal-mcps]
      operationId: createPersonalMcp
      summary: Create one selected candidate in preparing state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonalMcpRequest'
            examples:
              depwire:
                $ref: '#/components/examples/CreateDepwire'
      responses:
        '201':
          description: Item created; no runner has started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalMcp'
        '409':
          $ref: '#/components/responses/QuotaError'
        '422':
          $ref: '#/components/responses/InvalidPayload'
  /api/v1/personal-mcps/usage:
    get:
      tags: [personal-mcps]
      operationId: getPersonalMcpUsage
      summary: Return personal MCP resource limits and usage
      responses:
        '200':
          description: Reservation and actual usage; stopped storage remains allocated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalMcpUsage'
  /api/v1/personal-mcps/{personal_mcp_id}:
    parameters:
      - $ref: '#/components/parameters/PersonalMcpId'
    get:
      tags: [personal-mcps]
      operationId: getPersonalMcp
      summary: Get safe lifecycle state and diagnostics
      responses:
        '200':
          description: Personal MCP state without endpoint or secret values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalMcp'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [personal-mcps]
      operationId: deletePersonalMcp
      summary: Delete the MCP and persistent data after explicit confirmation
      parameters:
        - name: confirm_data_delete
          in: query
          required: true
          schema:
            type: boolean
            const: true
          description: Must be true; deletion is the only data-destructive action.
      responses:
        '202':
          description: Cleanup accepted; state is deleting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalMcp'
        '428':
          $ref: '#/components/responses/DeleteConfirmationRequired'
        '502':
          $ref: '#/components/responses/DeleteCleanupFailed'
  /api/v1/personal-mcps/{personal_mcp_id}/events:
    parameters:
      - $ref: '#/components/parameters/PersonalMcpId'
      - name: after
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor; JSON polling is canonical.
    get:
      tags: [personal-mcps]
      operationId: listPersonalMcpEvents
      summary: Poll safe progress events
      responses:
        '200':
          description: Ordered events after cursor
          content:
            application/json:
              schema:
                type: object
                required: [events, next_cursor]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/PersonalMcpEvent'
                  next_cursor:
                    type: [string, 'null']
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/personal-mcps/{personal_mcp_id}/verify:
    parameters:
      - $ref: '#/components/parameters/PersonalMcpId'
    post:
      tags: [personal-mcps]
      operationId: verifyPersonalMcp
      summary: Start if necessary and run initialize plus tools/list
      responses:
        '200':
          description: Idempotent verified state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalMcp'
        '409':
          $ref: '#/components/responses/PersonalMcpConflict'
        '422':
          $ref: '#/components/responses/VerificationError'
        '503':
          $ref: '#/components/responses/RunnerUnavailable'
        '504':
          $ref: '#/components/responses/HandshakeTimeout'
  /api/v1/personal-mcps/{personal_mcp_id}/start:
    parameters:
      - $ref: '#/components/parameters/PersonalMcpId'
    post:
      tags: [personal-mcps]
      operationId: startPersonalMcp
      summary: Start and verify a stopped personal MCP
      responses:
        '200':
          description: Verified state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalMcp'
        '409':
          $ref: '#/components/responses/QuotaError'
        '422':
          $ref: '#/components/responses/VerificationError'
        '503':
          $ref: '#/components/responses/RunnerUnavailable'
        '504':
          $ref: '#/components/responses/HandshakeTimeout'
  /api/v1/personal-mcps/{personal_mcp_id}/stop:
    parameters:
      - $ref: '#/components/parameters/PersonalMcpId'
    post:
      tags: [personal-mcps]
      operationId: stopPersonalMcp
      summary: Stop the process but preserve bindings and persistent data
      responses:
        '200':
          description: Stopped state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalMcp'
        '409':
          $ref: '#/components/responses/PersonalMcpConflict'
  /api/v1/personal-mcps/{personal_mcp_id}/restart:
    parameters:
      - $ref: '#/components/parameters/PersonalMcpId'
    post:
      tags: [personal-mcps]
      operationId: restartPersonalMcp
      summary: Stop, start and verify the current revision
      responses:
        '200':
          description: Verified state after restart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalMcp'
        '409':
          $ref: '#/components/responses/QuotaError'
        '422':
          $ref: '#/components/responses/VerificationError'
        '503':
          $ref: '#/components/responses/RunnerUnavailable'
        '504':
          $ref: '#/components/responses/HandshakeTimeout'
  /api/v1/personal-mcps/{personal_mcp_id}/update:
    parameters:
      - $ref: '#/components/parameters/PersonalMcpId'
    post:
      tags: [personal-mcps]
      operationId: updatePersonalMcp
      summary: Verify a new candidate and atomically switch revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonalMcpRequest'
      responses:
        '200':
          description: New verified revision or previous revision after rollback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalMcp'
        '409':
          $ref: '#/components/responses/QuotaError'
        '422':
          $ref: '#/components/responses/VerificationError'
  /api/v1/personal-mcps/{personal_mcp_id}/secret-bindings:
    parameters:
      - $ref: '#/components/parameters/PersonalMcpId'
    get:
      tags: [secret-bindings]
      operationId: listPersonalMcpSecretBindings
      summary: List env names and binding metadata without values
      responses:
        '200':
          description: Safe secret binding metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SecretBinding'
    put:
      tags: [secret-bindings]
      operationId: replacePersonalMcpSecretBindings
      summary: Idempotently replace the allowed env-to-secret mapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretBindingsRequest'
      responses:
        '200':
          description: Safe binding metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SecretBinding'
        '422':
          $ref: '#/components/responses/SecretBindingError'
  /api/v1/personal-mcps/{personal_mcp_id}/room-bindings:
    parameters:
      - $ref: '#/components/parameters/PersonalMcpId'
    get:
      tags: [room-bindings]
      operationId: listPersonalMcpRoomBindings
      summary: List room assignments and availability
      responses:
        '200':
          description: Bindings persist while stopped but are unavailable to agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomBinding'
    post:
      tags: [room-bindings]
      operationId: attachPersonalMcpToRoom
      summary: Attach a verified personal MCP without auto-start
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomBindingRequest'
      responses:
        '201':
          description: Room binding created and available immediately
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomBinding'
        '403':
          $ref: '#/components/responses/RoomNotAllowed'
        '409':
          $ref: '#/components/responses/NotVerifiedOrBindingLimit'
  /api/v1/personal-mcps/{personal_mcp_id}/room-bindings/{room_id}:
    parameters:
      - $ref: '#/components/parameters/PersonalMcpId'
      - $ref: '#/components/parameters/RoomId'
    delete:
      tags: [room-bindings]
      operationId: detachPersonalMcpFromRoom
      summary: Remove a room assignment
      responses:
        '204':
          description: Binding removed
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PersonalMcpId:
      name: personal_mcp_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoomId:
      name: room_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidJson:
      description: Invalid JSON
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidPayload:
      description: Safe validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    QuotaError:
      description: Quota or lifecycle admission error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PersonalMcpConflict:
      description: Invalid state transition or concurrent revision
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    VerificationError:
      description: Safe protocol or package verification error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RunnerUnavailable:
      description: Runner service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    HandshakeTimeout:
      description: MCP protocol timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SecretBindingError:
      description: Secret binding is invalid or not owned by the caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RoomNotAllowed:
      description: Room is not owned by the caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotVerifiedOrBindingLimit:
      description: Room assignment is not admitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found or not owned by the caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DeleteConfirmationRequired:
      description: Explicit data deletion confirmation is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DeleteCleanupFailed:
      description: Data cleanup did not complete; storage remains allocated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ImportPreviewRequest:
      oneOf:
        - $ref: '#/components/schemas/McpServersImport'
        - $ref: '#/components/schemas/SingleCommandImport'
      description: Either an MCP configuration object or one command/args pair.
    McpServersImport:
      type: object
      required: [mcpServers]
      additionalProperties: false
      properties:
        mcpServers:
          type: object
          minProperties: 1
          maxProperties: 20
          additionalProperties:
            $ref: '#/components/schemas/McpServerConfig'
    SingleCommandImport:
      type: object
      required: [command, args]
      additionalProperties: false
      properties:
        command:
          type: string
          enum: [npx, npm]
        args:
          type: array
          maxItems: 128
          items:
            type: string
            minLength: 1
            maxLength: 2048
        env:
          $ref: '#/components/schemas/EnvPlaceholders'
        name:
          type: string
          maxLength: 80
    McpServerConfig:
      type: object
      required: [command, args]
      additionalProperties: false
      properties:
        command:
          type: string
          enum: [npx, npm]
        args:
          type: array
          maxItems: 128
          items:
            type: string
            minLength: 1
            maxLength: 2048
        env:
          $ref: '#/components/schemas/EnvPlaceholders'
    EnvPlaceholders:
      type: object
      maxProperties: 64
      propertyNames:
        pattern: '^[A-Z_][A-Z0-9_]*$'
      additionalProperties:
        type: [string, 'null']
        maxLength: 2048
      description: Values may only be empty, null, or VAR placeholders.
    CreatePersonalMcpRequest:
      type: object
      required: [contract_version, preview_id, candidate_id, memory_reservation_mb, storage_reservation_mb]
      additionalProperties: false
      properties:
        contract_version:
          type: string
          const: personal-mcp.v1
        preview_id:
          type: string
          format: uuid
        candidate_id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        memory_reservation_mb:
          type: integer
          minimum: 128
        storage_reservation_mb:
          type: integer
          minimum: 256
        secret_bindings:
          $ref: '#/components/schemas/SecretBindings'
    UpdatePersonalMcpRequest:
      allOf:
        - $ref: '#/components/schemas/CreatePersonalMcpRequest'
      description: Fresh candidate becomes a new revision.
    SecretBindingInput:
      type: object
      required: [env_name, secret_id]
      additionalProperties: false
      properties:
        env_name:
          type: string
          pattern: '^[A-Z_][A-Z0-9_]*$'
          maxLength: 128
        secret_id:
          type: string
          format: uuid
    SecretBindings:
      type: array
      maxItems: 64
      uniqueItems: true
      items:
        $ref: '#/components/schemas/SecretBindingInput'
    SecretBindingsRequest:
      type: object
      required: [bindings]
      additionalProperties: false
      properties:
        bindings:
          $ref: '#/components/schemas/SecretBindings'
    RoomBindingRequest:
      type: object
      required: [room_id]
      additionalProperties: false
      properties:
        room_id:
          type: string
          format: uuid
    ImportPreviewResponse:
      type: object
      required: [contract_version, preview_id, expires_at, candidates, rejected]
      properties:
        contract_version:
          type: string
          const: personal-mcp.v1
        preview_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ImportCandidate'
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/RejectedCandidate'
    ImportCandidate:
      type: object
      required: [candidate_id, source_name, display_name, mode, runtime_profile, transport, package, command_args, env_names, normalized_argv, shell, pinning, supported]
      properties:
        candidate_id:
          type: string
          format: uuid
        source_name:
          type: string
        display_name:
          type: string
        mode:
          type: string
          const: managed_stdio
        runtime_profile:
          type: string
          const: node_npx_v1
        transport:
          type: string
          const: stdio
        package:
          $ref: '#/components/schemas/PackageSpec'
        command_args:
          type: array
          items:
            type: string
        env_names:
          type: array
          items:
            type: string
        normalized_argv:
          type: array
          items:
            type: string
        shell:
          type: boolean
          const: false
        pinning:
          $ref: '#/components/schemas/Pinning'
        warnings:
          type: array
          items:
            type: string
        supported:
          type: boolean
          const: true
    RejectedCandidate:
      type: object
      required: [source_name, error]
      properties:
        source_name:
          type: string
        error:
          $ref: '#/components/schemas/SafeError'
    PackageSpec:
      type: object
      required: [requested, registry_name]
      properties:
        requested:
          type: string
        registry_name:
          type: string
        requested_version:
          type: [string, 'null']
    Pinning:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, pinned]
        version:
          type: [string, 'null']
        integrity:
          type: [string, 'null']
        resolved_at:
          type: [string, 'null']
          format: date-time
    PersonalMcp:
      type: object
      required: [id, contract_version, name, mode, runtime_profile, transport, desired_status, actual_status, ready_for_room, revision, launch_profile, resources, tools, room_bindings, correlation_id]
      properties:
        id:
          type: string
          format: uuid
        contract_version:
          type: string
          const: personal-mcp.v1
        name:
          type: string
        mode:
          type: string
          const: managed_stdio
        runtime_profile:
          type: string
          const: node_npx_v1
        transport:
          type: string
          const: stdio
        desired_status:
          type: string
          enum: [stopped, running, deleted]
        actual_status:
          $ref: '#/components/schemas/ActualStatus'
        ready_for_room:
          type: boolean
        revision:
          type: integer
          minimum: 1
        launch_profile:
          $ref: '#/components/schemas/LaunchProfile'
        resolved_artifact:
          $ref: '#/components/schemas/ResolvedArtifact'
        resources:
          $ref: '#/components/schemas/ResourceUsage'
        tools:
          $ref: '#/components/schemas/ToolsSnapshot'
        room_bindings:
          type: array
          items:
            $ref: '#/components/schemas/RoomBinding'
        secret_bindings:
          type: array
          items:
            $ref: '#/components/schemas/SecretBinding'
        last_error:
          type: [object, 'null']
          allOf:
            - $ref: '#/components/schemas/SafeError'
        correlation_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ActualStatus:
      type: string
      enum: [preparing, starting, running, verifying, verified, stopping, stopped, updating, error, deleting, deleted]
    LaunchProfile:
      type: object
      required: [mode, runtime_profile, transport, package, command_args, env_names, normalized_argv, shell]
      properties:
        mode:
          type: string
          const: managed_stdio
        runtime_profile:
          type: string
          const: node_npx_v1
        transport:
          type: string
          const: stdio
        package:
          type: string
        command_args:
          type: array
          items:
            type: string
        env_names:
          type: array
          items:
            type: string
        normalized_argv:
          type: array
          items:
            type: string
        shell:
          type: boolean
          const: false
    ResolvedArtifact:
      type: object
      required: [package, version, integrity, resolved_at]
      properties:
        package:
          type: string
        version:
          type: string
        integrity:
          type: string
        resolved_at:
          type: string
          format: date-time
    ResourceUsage:
      type: object
      required: [memory_reservation_mb, memory_usage_mb, storage_reservation_mb, storage_used_mb]
      properties:
        memory_reservation_mb:
          type: integer
          minimum: 0
        memory_usage_mb:
          type: integer
          minimum: 0
        storage_reservation_mb:
          type: integer
          minimum: 0
        storage_used_mb:
          type: integer
          minimum: 0
    ToolsSnapshot:
      type: object
      required: [count, names, fingerprint]
      properties:
        count:
          type: integer
          minimum: 0
          maximum: 512
        names:
          type: array
          maxItems: 512
          items:
            type: string
            maxLength: 128
        fingerprint:
          type: string
    RoomBinding:
      type: object
      required: [room_id, available, status]
      properties:
        room_id:
          type: string
          format: uuid
        available:
          type: boolean
        status:
          type: string
          enum: [available, stopped, unavailable]
    SecretBinding:
      type: object
      required: [env_name, secret_id, label, state]
      properties:
        env_name:
          type: string
          pattern: '^[A-Z_][A-Z0-9_]*$'
        secret_id:
          type: string
          format: uuid
        label:
          type: string
        state:
          type: string
          enum: [active, disabled, missing]
    PersonalMcpUsage:
      type: object
      required: [limits, installed_count, running_count, memory_reserved_mb, memory_used_mb, storage_allocated_mb, storage_used_mb]
      properties:
        limits:
          $ref: '#/components/schemas/PersonalMcpLimits'
        installed_count:
          type: integer
          minimum: 0
        running_count:
          type: integer
          minimum: 0
        memory_reserved_mb:
          type: integer
          minimum: 0
        memory_used_mb:
          type: integer
          minimum: 0
        storage_allocated_mb:
          type: integer
          minimum: 0
        storage_used_mb:
          type: integer
          minimum: 0
    PersonalMcpLimits:
      type: object
      required: [mcp_personal_max_installed, mcp_personal_max_running, mcp_personal_max_total_memory_mb, mcp_personal_max_memory_per_server_mb, mcp_personal_storage_quota_mb, mcp_personal_max_storage_per_server_mb, mcp_personal_max_room_bindings_per_server, mcp_personal_monthly_hours]
      properties:
        mcp_personal_max_installed:
          type: integer
          minimum: 0
        mcp_personal_max_running:
          type: integer
          minimum: 0
        mcp_personal_max_total_memory_mb:
          type: integer
          minimum: 0
        mcp_personal_max_memory_per_server_mb:
          type: integer
          minimum: 0
        mcp_personal_storage_quota_mb:
          type: integer
          minimum: 0
        mcp_personal_max_storage_per_server_mb:
          type: integer
          minimum: 0
        mcp_personal_max_room_bindings_per_server:
          type: integer
          minimum: 0
        mcp_personal_monthly_hours:
          type: [integer, 'null']
          minimum: 0
    PersonalMcpEvent:
      type: object
      required: [event_id, type, step, occurred_at, correlation_id, message]
      properties:
        event_id:
          type: string
        type:
          type: string
          enum: [progress, state_changed, diagnostic]
        step:
          type: string
          enum: [config_accepted, package_resolving, package_pinned, runner_starting, protocol_initializing, tools_discovered, ready, failed]
        occurred_at:
          type: string
          format: date-time
        correlation_id:
          type: string
        message:
          type: string
          maxLength: 500
        percent:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        safe_details:
          type: object
          additionalProperties: false
          properties:
            tool_count:
              type: integer
              minimum: 0
            tool_names:
              type: array
              maxItems: 512
              items:
                type: string
                maxLength: 128
            fingerprint:
              type: string
    SafeError:
      type: object
      required: [code, message, remedy, retryable, details, correlation_id]
      properties:
        code:
          type: string
        message:
          type: string
          maxLength: 500
        remedy:
          type: string
          maxLength: 500
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
          description: Safe numeric or enum details only; never secrets or raw command output.
        correlation_id:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/SafeError'
