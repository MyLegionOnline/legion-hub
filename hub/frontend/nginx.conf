# Query strings carry secrets (WebSocket ?token=, one-time letter links,
# ?code=&state= of sign-ins) and so does the Referer of the page after a
# sign-in: log the path without them.
log_format legion_hub_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log legion_hub_noquery;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Skill packages go up to 100 MiB (the tariff upload limit); nginx's own
    # default of 1 MiB would answer 413 to most uploads.
    client_max_body_size 110m;

    # The backend is looked up through Docker's DNS on each request, not once
    # at start: a restarted backend container may come back on another address,
    # and a name resolved at start would answer 502 until nginx restarts too.
    # With a variable, proxy_pass forwards the request URI unchanged.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $hub_backend http://backend:8000;

    # SPA routing - fallback to index.html for client-side routing.
    # index.html names the hashed bundles: never cached, or a deploy is
    # invisible until a hard reload.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend. Room and event sockets live under /api/
    # too: an idle socket must outlive nginx's default 60 s read timeout.
    location /api/ {
        proxy_pass $hub_backend;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Admin API for admin_center — double protection: IP allowlist here
    # + X-Admin-Token check in the backend. ADMIN_ALLOW_IP is substituted
    # from env at container start (nginx template mechanism); set it to the
    # admin_center server IP (or CIDR). Default 127.0.0.1 = effectively closed.
    location /internal/admin/ {
        allow ${ADMIN_ALLOW_IP};
        deny all;
        proxy_pass $hub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Anything else under /internal/ is never exposed
    location /internal/ {
        deny all;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Previews of apps running in a room, for a Hub opened on this machine
# (deploy/selfhost, LEGION_BROWSER_PREVIEW=true). Browsers resolve *.localhost
# to this machine by themselves, so svc-<id>.preview.localhost:<port> needs no
# DNS; the backend tells the services apart by Host, which must keep its port.
# With the preview gateway off, or on another WORKSPACE_PREVIEW_DOMAIN, no such
# Host is ever sent here (a real domain reaches the backend through the edge
# proxy, not through this container).
server {
    listen 80;
    access_log /var/log/nginx/access.log legion_hub_noquery;
    server_name ~^svc-[0-9a-f-]+\.preview\.localhost$;

    # The backend enforces WORKSPACE_PREVIEW_MAX_BODY_BYTES (at most 128 MiB).
    client_max_body_size 130m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $hub_backend http://backend:8000;

    location / {
        proxy_pass $hub_backend;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A preview Host the backend does not recognise falls through to the Hub's
    # own routes; its internal ones stay closed here as on the main server.
    location /internal/ {
        deny all;
    }
}
